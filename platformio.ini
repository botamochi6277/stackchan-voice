; PlatformIO Project Configuration File
;
; This project builds the example sketch (examples/SineWave) with the library in this directory.
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-cores3
src_dir = examples/SineWave

[env]
; pioarduino platform (Arduino-ESP32 3.x / ESP-IDF 5.x), not the stock espressif32
; https://github.com/pioarduino/platform-espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
build_unflags =
  -std=gnu++11
lib_deps =
  m5stack/M5Unified@^0.2.14
  symlink://.

[env:m5stack-cores3]
board = m5stack-cores3

[env:m5stack-core2]
board = m5stack-core2
